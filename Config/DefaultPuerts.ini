; PuerTS (puer.ts) 配置
; 对应 UPuertsSetting（Source/Puerts/Private/PuertsSetting.h），也可在
; 编辑器 项目设置 -> Plugins -> Puerts 中可视化修改（效果等价）。
;
; AutoModeEnable=true 会在编辑器启动时自动创建默认 JS 虚拟机，
; 并启用编辑器内置 TypeScript 服务（监视 .ts 变更并自动编译到 Content/JavaScript）。
; 不开启则编辑器不会自动编译 TypeScript。

[/Script/Puerts.PuertsSetting]
AutoModeEnable=true

; 脚本根目录（默认 "JavaScript"，即 <项目>/Content/JavaScript，一般无需修改）
; RootPath=JavaScript

; 调试相关（需要调试 TS 时再打开）
; DebugEnable=false
; DebugPort=8080
; WaitDebugger=false
